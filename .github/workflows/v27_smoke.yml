name: V27 MFSCR reduced CIFAR-100 development

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  v27:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Skip result commits
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[v27-results\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install CPU research dependencies
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet numpy scipy
      - name: Decode frozen experiment
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          payload = pathlib.Path('v27_mfscr.py.gz.b64').read_text().strip()
          pathlib.Path('v27_mfscr.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Run reduced Split CIFAR-100 development
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          rm -rf v27_results/mfscr_cifar_dev
          mkdir -p v27_results/mfscr_cifar_dev
          python v27_mfscr.py --output v27_results/mfscr_cifar_dev --data-root "$RUNNER_TEMP/cifar100" 2>&1 | tee v27_results/mfscr_cifar_dev/run.log
      - name: Commit research results
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "v27-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add v27_results/mfscr_cifar_dev
          git commit -m "[v27-results] MFSCR CIFAR development" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
